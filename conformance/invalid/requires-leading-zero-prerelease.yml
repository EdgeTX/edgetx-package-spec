# expect: '\^1\.2\.3-03' does not match
# INVALID: a dependency range uses the same strict semver grammar as
# `package.version`, so a numeric prerelease identifier must not carry a leading
# zero here either.
edgetx_format_version: "1.0"
package:
  id: github.com/acme/range-leading-zero
  description: Package whose dependency range uses an invalid prerelease
requires:
  - id: github.com/someone/elrs-libs
    version: "^1.2.3-03"
