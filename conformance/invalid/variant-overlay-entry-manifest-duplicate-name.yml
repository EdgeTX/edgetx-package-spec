# SEMANTIC-ONLY: inline content on the selected variant entry and content in the
# selected variant manifest share a content-item name. Name uniqueness is
# checked after the full base + selected-entry + selected-manifest merge.
edgetx_format_version: "1.1"
package:
  id: github.com/acme/overlay-entry-manifest-name-collision
  description: Package whose inline overlay collides with its selected variant manifest
  variants:
    - path: invalid-variants/entry-manifest-duplicate-name.color.yml
      libraries:
        - name: SharedName
          path: SCRIPTS/LIBS/InlineShared
