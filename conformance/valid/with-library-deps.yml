# Package with a shared library alongside the scripts that use it. All of a
# package's content installs and is removed together, so nothing has to declare
# the relationship — the `libraries` section is there to say what a thing IS.
edgetx_format_version: "1.0"
package:
  id: github.com/ExpressLRS/Lua-Scripts
  name: ExpressLRS
  description: ExpressLRS Lua scripts and widgets for EdgeTX
  license: GPL-3.0-only
  min_edgetx_version: "2.12.0"

libraries:
  - name: ELRS
    path: SCRIPTS/ELRS

tools:
  - name: ExpressLRS
    path: SCRIPTS/TOOLS/ExpressLRS

widgets:
  - name: ELRSTelemetry
    path: WIDGETS/ELRSTelemetry
