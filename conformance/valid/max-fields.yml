# Every package-level field populated. Features that cannot coexist with these,
# or with each other, live in their own fixtures:
#
#   variants     multi-variant.yml, variant-standalone.yml
#   requires     with-requires.yml, bounded-requires-range.yml
#   dest         path-dot-with-dest.yml, all-sections.yml
#   dev          dev-content.yml
#   source_dir   as a list: multiple-source-dirs.yml
#
edgetx_format_version: "1.0"
package:
  id: github.com/comprehensive/full-example
  name: Comprehensive Package Example
  version: "1.0.0-beta.1+build.123"
  description: A package demonstrating all available manifest fields
  authors:
    - name: John Doe
      email: john@example.com
    - name: Jane Smith
  urls:
    - name: Homepage
      url: https://example.com
    - name: Documentation
      url: https://docs.example.com
    - name: Issues
      url: https://github.com/comprehensive/full-example/issues
  screenshots:
    - screenshots/main.png
    - screenshots/settings.png
  keywords: ["example", "comprehensive", "test", "demo"]
  license: Apache-2.0 OR MIT
  source_dir: src
  min_edgetx_version: "2.11.0"
  max_edgetx_version: "2.14.x"
  binary: true
  capabilities:
    display:
      type: colorlcd
      resolution: 480x272
      touch: true

libraries:
  - name: UtilLib
    path: SCRIPTS/LIBS/UtilLib

tools:
  - name: MainTool
    path: SCRIPTS/TOOLS/MainTool
    exclude:
      - "*.md"
      - "test/*"

widgets:
  - name: MainWidget
    path: WIDGETS/MainWidget
