# Subpackage: a package that lives inside a multi-package repository.
# The id includes the subdirectory path after host/owner/repo.
spec_version: "1.0"
package:
  id: github.com/offer-shmuely/lua-scripts/log-viewer
  name: Log Viewer
  description: Flight log viewer subpackage
  license: GPL-3.0-only
  min_edgetx_version: "2.11.0"
  variants:
    - path: edgetx.bw128x64.yml
      capabilities:
        display:
          type: bw
          resolution: 128x64
    - path: edgetx.color.yml
      capabilities:
        display:
          type: colorlcd
