# expect: '\.\./\.\./\.\./etc/passwd' does not match
# INVALID: `source.ref` is read off a removable card and handed to a fetch, so it
# carries a git refname's constraints — no `..` anywhere, no leading or trailing
# `/`, no `.lock` suffix, no leading `-` a command line would read as an option.
# Any tool that builds a cache path from it otherwise has traversal from a
# card-write primitive.
edgetx_format_version: "1.0"
packages:
  - id: github.com/acme/ref-traversal
    version: "1.0.0"
    reason: explicit
    requires: []
    source:
      repo: github.com/acme/ref-traversal
      channel: branch
      ref: "../../../etc/passwd"
      commit: "3f9a1c0e4b7d2a5f8c1e6b0d9a4f7c2e5b8d1a03"
      manifest_path: "edgetx.yml"
