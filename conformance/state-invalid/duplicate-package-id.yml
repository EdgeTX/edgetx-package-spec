# SEMANTIC-ONLY: two entries share an id, but `id` is the primary key. JSON
# Schema cannot express uniqueness by a single property — `uniqueItems` compares
# whole objects, and these two differ in `version`.
#
# It matters more here than it looks: the file-list name is derived from the id,
# so two entries with one id means two packages sharing one inventory file.
edgetx_format_version: "1.0"
packages:
  - id: github.com/acme/simple-tool
    version: "1.0.0"
    reason: explicit
    requires: []
    source:
      repo: github.com/acme/simple-tool
      channel: tag
      ref: "v1.0.0"
      commit: "3f9a1c0e4b7d2a5f8c1e6b0d9a4f7c2e5b8d1a03"
      manifest_path: "edgetx.yml"
  - id: github.com/acme/simple-tool
    version: "2.0.0"
    reason: explicit
    requires: []
    source:
      repo: github.com/acme/simple-tool
      channel: tag
      ref: "v2.0.0"
      commit: "a4d81f0c9e2b7a6f3d5c8e1b0a9f4c7d2e6b8a15"
      manifest_path: "edgetx.yml"
