# expect: '\.\./\.\./\.\./\.\./etc/evil\.yml' is not valid
# INVALID: `variant` is read back from a removable card and joined onto the
# manifest directory, so it is subject to the same path rules as a manifest path.
# A '..' segment here would load a manifest from outside the package.
edgetx_format_version: "1.0"
packages:
  - id: github.com/acme/escaping-variant
    version: "1.0.0"
    reason: explicit
    requires: []
    variant: "../../../../etc/evil.yml"
    source:
      repo: github.com/acme/escaping-variant
      channel: tag
      ref: "v1.0.0"
      commit: "3f9a1c0e4b7d2a5f8c1e6b0d9a4f7c2e5b8d1a03"
      manifest_path: "edgetx.yml"
