name: Spec Validate

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  conformance-tests:
    name: Conformance — fixtures, schemas, links, tables and doc examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install jsonschema PyYAML

      # Single source of truth for conformance: manifest fixtures, state
      # fixtures, and every example embedded in the documentation. The runner
      # also checks that each schema is itself a well-formed JSON Schema — a
      # malformed one would silently accept everything.
      - name: Run conformance tests
        run: python3 conformance/run_tests.py

  docs-lint:
    name: Docs — lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.45.0

      - name: Lint Markdown files
        run: markdownlint --ignore node_modules "**/*.md"

  publish-schema:
    name: Publish schema as release asset (on release tag)
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # Docs lint gates the release too: a release should not ship with the
    # documentation in a state CI rejects.
    needs: [conformance-tests, docs-lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Attach schema to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            schema/edgetx-manifest.v1.json \
            schema/edgetx-state.v1.json \
            --clobber
